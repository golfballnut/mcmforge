schema: paperclip/v1
agents:
  ceo:
    adapter:
      type: claude_local
      config:
        model: claude-opus-4-6
  cto:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
  code-reviewer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
  release-engineer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
